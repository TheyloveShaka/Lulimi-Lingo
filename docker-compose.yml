version: '3.9'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: lulimi-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: lulimi-lingo
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - lulimi-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: ./backend_node
      dockerfile: Dockerfile
    container_name: lulimi-backend
    env_file:
      - ./backend_node/.env
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/lulimi-lingo
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      CORS_ORIGIN: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - lulimi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/curriculum"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lulimi-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_NODE_BACKEND_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - lulimi-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  lulimi-network:
    driver: bridge
