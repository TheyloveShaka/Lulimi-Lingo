<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lulimi Lingo - API Usage Monitor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
        color: #333;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }
      .header {
        background: white;
        padding: 30px;
        border-radius: 15px;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .header h1 {
        color: #667eea;
        margin-bottom: 10px;
      }
      .refresh-btn {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 15px;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        transition: all 0.3s;
      }
      .refresh-btn:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .stat-card h2 {
        color: #667eea;
        margin-bottom: 15px;
        font-size: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .stat-row:last-child {
        border-bottom: none;
      }
      .stat-label {
        color: #666;
        font-size: 14px;
      }
      .stat-value {
        font-weight: 600;
        color: #333;
        font-size: 16px;
      }
      .success-rate {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }
      .success-rate.good {
        background: #d4edda;
        color: #155724;
      }
      .success-rate.warning {
        background: #fff3cd;
        color: #856404;
      }
      .success-rate.bad {
        background: #f8d7da;
        color: #721c24;
      }
      .warnings {
        background: #fff3cd;
        border-left: 4px solid #ffc107;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      .warnings h3 {
        color: #856404;
        margin-bottom: 10px;
      }
      .warning-item {
        padding: 8px 0;
        color: #856404;
      }
      .no-warnings {
        background: #d4edda;
        border-left: 4px solid #28a745;
        padding: 20px;
        border-radius: 8px;
        color: #155724;
        margin-bottom: 20px;
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: white;
        font-size: 18px;
      }
      .timestamp {
        color: #999;
        font-size: 12px;
        margin-top: 10px;
      }
      .rate-limit-bar {
        background: #f0f0f0;
        height: 8px;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 8px;
      }
      .rate-limit-fill {
        height: 100%;
        transition:
          width 0.3s,
          background 0.3s;
      }
      .rate-limit-fill.low {
        background: #28a745;
      }
      .rate-limit-fill.medium {
        background: #ffc107;
      }
      .rate-limit-fill.high {
        background: #dc3545;
      }
      .icon {
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🚀 Lulimi Lingo - API Usage Monitor</h1>
        <p>Real-time monitoring of all API providers</p>
        <button class="refresh-btn" onclick="loadData()">
          🔄 Refresh Data
        </button>
      </div>

      <div id="loading" class="loading">Loading API usage data...</div>
      <div id="content" style="display: none">
        <div id="warnings"></div>
        <div class="stats-grid" id="stats-grid"></div>
      </div>
    </div>

    <script>
      async function loadData() {
        try {
          document.getElementById("loading").style.display = "block";
          document.getElementById("content").style.display = "none";

          const response = await fetch("http://localhost:8000/api/usage");
          const data = await response.json();

          displayWarnings(data.detailed_monitoring.warnings);
          displayStats(
            data.detailed_monitoring.providers,
            data.detailed_monitoring.rate_limits,
          );

          document.getElementById("loading").style.display = "none";
          document.getElementById("content").style.display = "block";
        } catch (error) {
          console.error("Error loading data:", error);
          document.getElementById("loading").innerHTML = `
                    <div style="background: #f8d7da; color: #721c24; padding: 20px; border-radius: 8px;">
                        ❌ Failed to load data. Make sure the backend is running on port 8000.
                    </div>
                `;
        }
      }

      function displayWarnings(warnings) {
        const container = document.getElementById("warnings");

        if (!warnings || warnings.length === 0) {
          container.innerHTML = `
                    <div class="no-warnings">
                        ✅ All systems operating normally. No warnings detected.
                    </div>
                `;
        } else {
          const warningItems = warnings
            .map((w) => `<div class="warning-item">⚠️ ${w}</div>`)
            .join("");
          container.innerHTML = `
                    <div class="warnings">
                        <h3>⚠️ Active Warnings</h3>
                        ${warningItems}
                    </div>
                `;
        }
      }

      function displayStats(providers, rateLimits) {
        const container = document.getElementById("stats-grid");
        const icons = {
          "Gemini API": "🤖",
          "OpenAI API": "🧠",
        };

        container.innerHTML = Object.entries(providers)
          .map(([name, stats]) => {
            const successRate = stats.success_rate;
            const rateClass =
              successRate >= 95
                ? "good"
                : successRate >= 80
                  ? "warning"
                  : "bad";

            const limit = rateLimits[name] || 100;
            const usage = stats.requests_last_minute;
            const usagePercent = (usage / limit) * 100;
            const barClass =
              usagePercent < 60 ? "low" : usagePercent < 80 ? "medium" : "high";

            return `
                    <div class="stat-card">
                        <h2><span class="icon">${icons[stats.provider] || "📊"}</span> ${stats.provider}</h2>
                        <div class="stat-row">
                            <span class="stat-label">Total Requests</span>
                            <span class="stat-value">${stats.total_requests.toLocaleString()}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Success Rate</span>
                            <span class="success-rate ${rateClass}">${successRate}%</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Failed Requests</span>
                            <span class="stat-value">${stats.failed_requests}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Total Tokens</span>
                            <span class="stat-value">${stats.total_tokens.toLocaleString()}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Estimated Cost</span>
                            <span class="stat-value">$${stats.estimated_cost.toFixed(4)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Last Hour</span>
                            <span class="stat-value">${stats.requests_last_hour} requests</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Rate Limit (1 min)</span>
                            <span class="stat-value">${usage}/${limit}</span>
                        </div>
                        <div class="rate-limit-bar">
                            <div class="rate-limit-fill ${barClass}" style="width: ${Math.min(usagePercent, 100)}%"></div>
                        </div>
                        <div class="timestamp">
                            Last request: ${stats.last_request ? new Date(stats.last_request).toLocaleString() : "Never"}
                        </div>
                    </div>
                `;
          })
          .join("");
      }

      // Auto-refresh every 10 seconds
      setInterval(loadData, 10000);

      // Initial load
      loadData();
    </script>
  </body>
</html>
